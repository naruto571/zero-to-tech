<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单卡片 · 小作品</title>
    <style>
        /* 干净的全局样式 — 柔和、现代、易读 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #f6f9fc 0%, #e9f0f8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            line-height: 1.5;
            color: #1e2b3c;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            max-width: 580px;
            width: 100%;
            border-radius: 2.5rem;
            padding: 2.5rem 2rem;
            box-shadow: 
                0 25px 40px -12px rgba(0, 20, 30, 0.25),
                0 8px 20px -8px rgba(0, 0, 0, 0.15),
                inset 0 0 0 1px rgba(255, 255, 255, 0.6);
            transition: transform 0.2s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 
                0 35px 50px -14px rgba(0, 20, 30, 0.3),
                0 12px 28px -10px rgba(0, 0, 0, 0.2),
                inset 0 0 0 1px rgba(255, 255, 255, 0.8);
        }

        /* 装饰性小元素 — 增加视觉趣味 */
        .badge {
            display: inline-block;
            background: #d0e2ff;
            color: #1e4a7a;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            padding: 0.4rem 1rem;
            border-radius: 100px;
            margin-bottom: 1.25rem;
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
            color: #0a1c2f;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        h1 span {
            background: linear-gradient(135deg, #1d4e89, #0b2b4a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .wave {
            font-size: 2rem;
            display: inline-block;
            animation: wave 2.5s infinite ease-in-out;
            transform-origin: 70% 70%;
        }

        @keyframes wave {
            0% { transform: rotate(0deg); }
            10% { transform: rotate(14deg); }
            20% { transform: rotate(-8deg); }
            30% { transform: rotate(14deg); }
            40% { transform: rotate(-4deg); }
            50% { transform: rotate(10deg); }
            60% { transform: rotate(0deg); }
            100% { transform: rotate(0deg); }
        }

        p {
            font-size: 1.1rem;
            color: #2c3e50;
            margin: 1.2rem 0 1.8rem;
            padding-right: 0.5rem;
        }

        .highlight {
            background: linear-gradient(120deg, #ffe9b6 0%, #ffe9b6 40%, #fff3d6 90%);
            padding: 0.1rem 0.4rem;
            border-radius: 8px;
            font-weight: 500;
            color: #0a1c2f;
            white-space: nowrap;
        }

        /* 按钮区域 — 清爽、交互友好 */
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            margin-top: 1.8rem;
        }

        .btn-primary {
            background: #1d4e89;
            color: white;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            padding: 0.9rem 2rem;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 6px 16px -4px rgba(29, 78, 137, 0.35);
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            letter-spacing: 0.2px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            flex: 0 1 auto;
        }

        .btn-primary:hover {
            background: #0f3b66;
            box-shadow: 0 10px 20px -6px rgba(29, 78, 137, 0.5);
            transform: scale(1.01);
        }

        .btn-primary:active {
            transform: scale(0.98);
            background: #0a2a4a;
            box-shadow: 0 4px 10px -4px rgba(29, 78, 137, 0.6);
        }

        .btn-secondary {
            background: transparent;
            color: #1d4e89;
            font-size: 1rem;
            font-weight: 600;
            padding: 0.9rem 1.8rem;
            border-radius: 60px;
            cursor: pointer;
            border: 1.5px solid rgba(29, 78, 137, 0.3);
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            flex: 0 1 auto;
        }

        .btn-secondary:hover {
            background: rgba(29, 78, 137, 0.08);
            border-color: rgba(29, 78, 137, 0.6);
            transform: translateY(-1px);
        }

        .btn-secondary:active {
            transform: translateY(0);
            background: rgba(29, 78, 137, 0.15);
        }

        /* 分隔线 + 小脚注 */
        .footnote {
            margin-top: 2.2rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #5d7188;
            flex-wrap: wrap;
            gap: 0.6rem;
        }

        .dot-group {
            display: flex;
            gap: 0.4rem;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #b8cee8;
            transition: background 0.2s;
        }

        .dot.active {
            background: #1d4e89;
            width: 22px;
            border-radius: 20px;
        }

        /* 响应式微调 */
        @media (max-width: 480px) {
            body { padding: 0.8rem; }
            .card { padding: 1.8rem 1.4rem; border-radius: 2rem; }
            h1 { font-size: 1.9rem; }
            p { font-size: 1rem; }
            .btn-primary, .btn-secondary {
                padding: 0.8rem 1.4rem;
                font-size: 0.95rem;
                width: 100%;
                justify-content: center;
            }
            .actions { flex-direction: column; }
            .footnote { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- 微小装饰标签 -->
        <div class="badge">? 简单 · 干净 · 现代</div>

        <h1>
            <span>你好，世界</span>
            <span class="wave">??</span>
        </h1>

        <p>
            这是一个简单的 HTML 卡片页面。里面有一个<strong>标题</strong>、一段<strong>简介</strong>，
            还有两个<strong>交互按钮</strong> —— 它们能触发浏览器的原生弹窗，顺便展示一下<span class="highlight">JavaScript</span>的小趣味。
            整体风格清爽，适合作为个人小页面的起点。
        </p>

        <!-- 交互按钮组，点击弹出简单消息 -->
        <div class="actions">
            <button class="btn-primary" id="greetBtn">
                ? 点我问候
            </button>
            <button class="btn-secondary" id="timeBtn">
                ?? 显示当前时间
            </button>
        </div>

        <!-- 底部点缀与动态时间显示区（点击按钮后更新） -->
        <div class="footnote">
            <div class="dot-group">
                <span class="dot active"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
            <span id="messagePreview">点击按钮试试看 ?</span>
        </div>
    </div>

    <script>
        (function() {
            // 获取元素
            const greetBtn = document.getElementById('greetBtn');
            const timeBtn = document.getElementById('timeBtn');
            const messagePreview = document.getElementById('messagePreview');

            // 问候按钮 —— 弹出问候语并更新预览文字
            greetBtn.addEventListener('click', function() {
                const greetings = [
                    '你好呀！?? 今天过得开心吗？',
                    '嗨！很高兴见到你 ??',
                    'Hello! 愿你有个美好的一天 ??',
                    '嘿～ 谢谢你的点击 ?',
                    '你好，世界！?? 简单也很美好。'
                ];
                // 随机选一句问候语
                const randomIndex = Math.floor(Math.random() * greetings.length);
                const selectedGreeting = greetings[randomIndex];

                // 弹窗 (简单的浏览器交互)
                alert(selectedGreeting);
                // 同时更新小预览区域
                messagePreview.textContent = '?? 刚刚说：' + selectedGreeting;
            });

            // 时间按钮 —— 显示当前时间，并同步到预览和弹窗
            timeBtn.addEventListener('click', function() {
                const now = new Date();
                // 格式化时间: 年-月-日 时:分:秒
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');

                const timeString = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
                const displayMessage = `?? 现在是 ${timeString}`;

                alert(displayMessage);
                messagePreview.textContent = displayMessage;
            });

            // 可选：给卡片底部预览加上一点初始提示（已存在）
            // 但如果你点击任意按钮，预览区文字会变化
        })();
    </script>
</body>
</html>
